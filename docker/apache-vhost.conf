<VirtualHost *:80>
    ServerName _

    DocumentRoot /app/public
    DirectoryIndex index.html index.php

    <Directory /app/public>
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_URI} ^/wiki($|/) [NC]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /wiki/index.html [L]

        RewriteCond %{REQUEST_URI} ^/api/ [OR]
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        RewriteRule . /index.html [L]
    </Directory>

    # App-shell assets must revalidate on every load, matching router.php.
    # The client is an ES-module graph loaded by bare URL, so without this a
    # heuristically cached old module can pair with a fresh main.js after a
    # deploy and break in ways no normal reload fixes.
    <LocationMatch "^/(index\.html|js/(main|patch-notes)\.js|js/(core|screens)/[^/]+\.js|css/(tokens|next|assets|screens)\.css)$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </LocationMatch>

    Alias /api /app/api
    <Directory /app/api>
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /app/includes>
        Require all denied
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
