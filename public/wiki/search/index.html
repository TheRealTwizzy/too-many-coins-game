<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Too Many Coins Wiki</title>
    <link rel="icon" href="/icon-192.png">
    <link rel="stylesheet" href="/wiki/assets/wiki.css">
</head>
<body>
    <div class="wiki-shell">
        <header class="wiki-topbar">
            <a class="wiki-brand" href="/wiki/">
                <span class="wiki-brand-mark">*</span>
                <span>Too Many Coins Wiki</span>
            </a>
            <div class="wiki-actions">
                <a class="wiki-btn" href="/wiki/">Wiki Home</a>
                <a class="wiki-btn" href="/">Back to Game</a>
            </div>
        </header>

        <main class="wiki-main">
            <aside class="wiki-sidebar">
                <nav class="wiki-nav" data-wiki-nav aria-label="Wiki Navigation"></nav>
            </aside>

            <section class="wiki-content wiki-page">
                <h2>Search Wiki</h2>
                <p class="wiki-muted">Search chapter titles and full section content grounded in current game logic.</p>
                <input id="wiki-search-input" class="wiki-search-input" type="text" placeholder="Search terms..." />
                <p id="wiki-search-state" class="wiki-muted"></p>
                <div id="wiki-search-results" class="wiki-grid" style="grid-template-columns: 1fr;"></div>
            </section>
        </main>
    </div>

    <script src="/wiki/assets/wiki-data.js"></script>
    <script src="/wiki/assets/wiki-render.js"></script>
    <script>window.WIKI_RENDER.renderNav(null);
      window.WIKI_RENDER.initSearchPage();</script>
</body>
</html>
