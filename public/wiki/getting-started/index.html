<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Getting Started - Too Many Coins Wiki</title>
    <link rel="icon" href="/icon-192.png">
    <link rel="stylesheet" href="/wiki/assets/wiki.css">
</head>
<body>
    <div class="wiki-shell">
        <header class="wiki-topbar">
            <a class="wiki-brand" href="/wiki/">
                <span class="wiki-brand-mark">*</span>
                <span>Too Many Coins Wiki</span>
            </a>
            <div class="wiki-actions">
                <a class="wiki-btn" href="/">Back to Game</a>
                <a class="wiki-btn" href="/wiki/search/">Search</a>
            </div>
        </header>

        <main class="wiki-main">
            <aside class="wiki-sidebar">
                <!-- Rendered from wiki-data.js so a new category does not mean
                     editing every page by hand. -->
                <nav class="wiki-nav" data-wiki-nav aria-label="Wiki Navigation"></nav>
            </aside>

            <section class="wiki-content wiki-page">
                <h2 id="category-title">Getting Started</h2>
                <p id="category-subtitle" class="wiki-muted"></p>
                <div id="category-jump" class="wiki-quick-links"></div>
                <div id="category-content"></div>
            </section>
        </main>
    </div>

    <script src="/wiki/assets/wiki-data.js"></script>
    <script src="/wiki/assets/wiki-render.js"></script>
    <script>window.WIKI_RENDER.initCategoryPage('getting-started');</script>
</body>
</html>
