<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#161826">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="Too Many Coins - A deterministic economic competition game. Earn coins, buy stars, collect sigils, activate boosts, and compete for the top.">
    <title>Too Many Coins</title>
    <link rel="manifest" href="/manifest.json">
    <!--
      The rebuilt client is THE client. The old ?ui=next / ?ui=legacy selector
      is gone: js/app.js and css/style.css remain on disk, parked and
      unreferenced, until a later cleanup deletes them.
    -->
    <link rel="stylesheet" href="css/tokens.css?v=next1">
    <link rel="stylesheet" href="css/next.css?v=next1">
    <link rel="stylesheet" href="css/assets.css?v=next1">
    <link rel="stylesheet" href="css/screens.css?v=next1">
    <!--
      No webfont link. Inter used to be pulled from fonts.googleapis.com, which
      made first paint depend on a third party: in any network-restricted
      environment the request fails and the console fills with errors, and
      everywhere else it leaks a request per visitor to Google before the app
      has drawn anything. The token stack in tokens.css already leads with the
      platform UI face, which is what the overwhelming majority of players were
      being served anyway once the webfont was blocked or slow.
    -->
</head>
<body>
    <div id="app"></div>
    <script type="module" src="js/main.js?v=next1"></script>
</body>
</html>
